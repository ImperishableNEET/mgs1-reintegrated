<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Metal Gear Solid: Reintegrated</title>
  <desc id="desc">Ivory angular italic wordmark with a red I and transparent background.</desc>
  <defs>
    <mask id="cuts"><rect width="1600" height="420" fill="white"/><path d="M80 183H1520 M80 218H1520" stroke="black" stroke-width="5"/></mask>
  </defs>
  <g fill="#f3eedc" font-family="Arial Black, Arial, sans-serif" font-weight="900">
    <text x="800" y="92" text-anchor="middle" font-size="38" letter-spacing="14">METAL GEAR SOLID</text>
    <g transform="translate(55 0) skewX(-12)" mask="url(#cuts)">
      <text x="54" y="286" font-size="170" textLength="1430" lengthAdjust="spacingAndGlyphs">RE<tspan fill="#c90016">I</tspan>NTEGRATED</text>
    </g>
    <text x="800" y="358" text-anchor="middle" font-size="30" letter-spacing="13" fill="#c90016">UNOFFICIAL SOURCE PORT</text>
  </g>
</svg>
